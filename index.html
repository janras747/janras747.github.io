<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jan Mark Rastica - Portfolio</title>
    <style>
        /* ==========================================================================
            0. HERO HEADER (Document Title)
            ========================================================================== */
        .page-header {
            position: sticky;
            top: 0;
            z-index: 900;
            padding: 0.8rem 2rem;
            background-color: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-top: 4px solid #38bdf8;
            border-bottom: 1px solid #334155;
            text-align: center;
        }

        .page-header h1 {
            color: #f8fafc;
            font-size: 2.2rem;
            margin: 0 0 0.5rem 0;
            font-weight: 700;
        }

        .page-header p {
            color: #94a3b8;
            font-size: 1.1rem;
            margin: 0;
            text-align: center;
        }

        /* ==========================================================================
            1. GLOBAL & SCROLL SETTINGS
            ========================================================================== */
        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            line-height: 1.6;
        }

        article[id], h1[id], h2[id], section[id] {
            scroll-margin-top: 6rem; 
        }

        /* ==========================================================================
            2. FIXED SIDEBAR LAYOUT
            ========================================================================== */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 33.33vw;
            min-width: 260px;
            max-width: 450px;
            height: 100vh;
            background-color: #1a1a24;
            box-shadow: 6px 0 20px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ==========================================================================
            3. TOGGLE MECHANISMS (HOVER + CLICK)
            ========================================================================== */
        @media (hover: hover) {
            .sidebar:hover {
                transform: translateX(0);
            }
        }

        #sidebar-toggle:checked ~ .sidebar {
            transform: translateX(0);
        }

        .sidebar-tab {
            position: absolute;
            top: 50%;
            right: -48px;
            width: 48px;
            height: 90px;
            background-color: #1a1a24;
            border-radius: 0 10px 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
            transform: translateY(-50%);
            box-shadow: 4px 0 12px rgba(0, 0, 0, 0.25);
        }

        .hamburger-line {
            width: 20px;
            height: 2px;
            background-color: #38bdf8;
            border-radius: 2px;
        }

        /* ==========================================================================
            4. HIERARCHICAL INDEX MENU
            ========================================================================== */
        .sidebar-content {
            padding: 2rem 1.5rem;
            height: 100vh;
            box-sizing: border-box;
            overflow-y: auto; 
            scrollbar-width: thin;
            scrollbar-color: #334155 transparent;
        }

        .sidebar-content::-webkit-scrollbar { width: 6px; }
        .sidebar-content::-webkit-scrollbar-thumb { background-color: #334155; border-radius: 3px; }

        .sidebar-content h2 {
            font-size: 1.2rem;
            color: #f8fafc;
            border-bottom: 1px solid #334155;
            padding-bottom: 0.75rem;
            margin-top: 0;
            margin-bottom: 1.5rem;
        }

        .article-accordion {
            margin-bottom: 1.25rem;
        }

        .article-accordion summary {
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            color: #f1f5f9;
            user-select: none;
            padding: 0.25rem 0;
            list-style-position: inside;
        }

        .article-accordion summary:hover {
            color: #38bdf8;
        }

        .article-accordion summary a {
            color: inherit;
            text-decoration: none;
        }

        .section-list {
            list-style: none;
            padding: 0 0 0 1rem;
            margin: 0.5rem 0 0 0.25rem;
            border-left: 2px solid #334155;
        }

        .section-list li {
            margin-bottom: 0.6rem;
        }

        .section-list a {
            font-size: 0.9rem;
            color: #94a3b8;
            text-decoration: none;
            display: inline-block;
            transition: color 0.2s, transform 0.2s;
        }

        .section-list a:hover {
            color: #38bdf8;
            transform: translateX(4px);
        }

        /* ==========================================================================
            5. MAIN PAGE CONTENT STYLES
            ========================================================================== */
        .content-container {
            margin-left: auto;
            margin-right: auto;
            max-width: 800px;
            padding: 4rem 2rem;
        }

        .article-card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 2.5rem;
            margin-bottom: 3rem;
            border: 1px solid #334155;
        }

        .article-card h1 {
            margin-top: 0;
            color: #f8fafc;
            border-bottom: 2px solid #334155;
            padding-bottom: 1rem;
        }

        .article-card h3 {
            color: #e2e8f0;
            font-weight: normal;
        }

        .article-card a {
            color: #38bdf8;
            text-decoration: none;
        }

        .article-card a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- HERO HEADER -->
    <header class="page-header">
        <p>This is the portfolio page of</p>
        <h1>Jan Mark Rastica</h1>
        <p>Welcome to my GitHub Page! These is the collection of my projects.</p>
    </header>

    <!-- HIDDEN CHECKBOX FOR MOBILE TOGGLE -->
    <input type="checkbox" id="sidebar-toggle" hidden>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <label for="sidebar-toggle" class="sidebar-tab" title="Toggle Index">
            <div class="hamburger-line"></div>
            <div class="hamburger-line"></div>
            <div class="hamburger-line"></div>
        </label>

        <nav class="sidebar-content">
            <h2>Index</h2>

            <details class="article-accordion" open>
                <summary><a href="#top">Top</a></summary>
            </details>
            
            <details class="article-accordion" open>
                <summary><a href="#web_pages">Web Pages</a></summary>
                <ul class="section-list">
                    <li><a href="#draft_libacao_childrens_code">Draft Libacao Children's Code</a></li>
                </ul>
            </details>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="content-container">

        <article id="top" class="article-card">
            <h3>You may hover on the navigation menu on the left portion of this page.</h3>
        </article>

        <article id="draft_libacao_childrens_code" class="article-card">
            <h1>Draft Libacao Children's Code</h1>
            <h3>
                <a href="draft_libacao_childrens_code.html" target="_blank" rel="noopener noreferrer">Click here to open.</a>
            </h3>
        </article>

    </main>

</body>
</html>
